version: '3.8'

services:
  backend:
    build: 
      context: ./erp-backend
      dockerfile: Dockerfile
    container_name: azer_backend
    ports:
      - "3000:3000"
    env_file:
      - ./erp-backend/.env
    environment:
      - FRONTEND_URL=http://localhost:80
    restart: unless-stopped
    networks:
      - azer_network

  frontend:
    build: 
      context: ./Front
      dockerfile: Dockerfile
    container_name: azer_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - azer_network

networks:
  azer_network:
    driver: bridge
